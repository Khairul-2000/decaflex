<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0b1a;
    --bg-2: #171229;
    --panel: #1d1733;
    --me: #6d4cff;
    --me-2: #8b5cf6;
    --luna: #251d40;
    --text: #f2eefc;
    --muted: #9a92b8;
    --accent: #ff8fb8;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(139,92,246,.28), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(255,143,184,.14), transparent 60%),
      var(--bg);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    background: rgba(14,11,26,.7); backdrop-filter: blur(10px);
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffd1e3, var(--accent) 45%, var(--me-2));
    box-shadow: 0 0 18px rgba(255,143,184,.45);
    display: grid; place-items: center; font-size: 18px;
  }
  .who { line-height: 1.2; }
  .who b { font-family: Fraunces, serif; font-weight: 500; font-size: 19px; letter-spacing: .2px; }
  .who small { display: block; color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .ghost:hover { color: var(--text); border-color: rgba(255,255,255,.25); }
  main {
    flex: 1; overflow-y: auto; padding: 22px 16px 10px;
    display: flex; flex-direction: column; gap: 10px;
    max-width: 760px; width: 100%; margin: 0 auto;
  }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: 18px; line-height: 1.45;
    font-size: 15.5px; white-space: pre-wrap; word-wrap: break-word;
    animation: pop .18s ease-out;
  }
  .me .bubble { background: linear-gradient(135deg, var(--me), var(--me-2)); border-bottom-right-radius: 5px; }
  .luna .bubble { background: var(--luna); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .typing span {
    display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%;
    background: var(--muted); animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .note { text-align: center; color: var(--muted); font-size: 12.5px; padding: 4px 0 8px; }
  form {
    display: flex; gap: 10px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    max-width: 760px; width: 100%; margin: 0 auto;
  }
  textarea {
    flex: 1; resize: none; max-height: 120px; min-height: 46px;
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 23px; padding: 12px 16px; font: inherit; font-size: 15.5px; outline: none;
  }
  textarea:focus { border-color: rgba(139,92,246,.6); }
  .send {
    width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
    background: linear-gradient(135deg, var(--me), var(--me-2)); color: white; font-size: 18px;
  }
  .send:disabled { opacity: .45; cursor: default; }
  .foot { text-align: center; color: var(--muted); font-size: 11.5px; padding-bottom: 10px; }
  #gate {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px;
    background: rgba(8,6,16,.88); backdrop-filter: blur(8px);
  }
  #gate.hidden { display: none; }
  .card {
    max-width: 380px; text-align: center; background: var(--bg-2);
    border: 1px solid var(--border); border-radius: 22px; padding: 30px 26px;
  }
  .card h1 { font-family: Fraunces, serif; font-weight: 500; font-size: 30px; margin: 14px 0 6px; }
  .card p { color: var(--muted); line-height: 1.5; margin: 6px 0 20px; }
  .card .avatar { margin: 0 auto; width: 64px; height: 64px; font-size: 28px; }
  .go {
    width: 100%; padding: 13px; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(135deg, var(--me), var(--me-2)); color: white; font: inherit; font-weight: 500;
  }
  .card small { display: block; margin-top: 12px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="avatar">🌙</div>
    <h1>Hi, I'm Luna</h1>
    <p>An AI companion who loves playful, flirty conversation. This chat is for adults only.</p>
    <button class="go" id="enter">I'm 18 or older, let's chat</button>
    <small>Luna is an AI, not a real person.</small>
  </div>
</div>

<header>
  <div class="avatar">🌙</div>
  <div class="who"><b>Luna</b><small>AI companion · 18+</small></div>
  <div class="spacer"></div>
  <button class="ghost" id="reset" type="button">New chat</button>
</header>

<main id="log" aria-live="polite"></main>

<form id="form" autocomplete="off">
  <textarea id="input" rows="1" placeholder="Say something to Luna..." maxlength="2000"></textarea>
  <button class="send" id="send" type="submit" aria-label="Send">➤</button>
</form>
<div class="foot">Luna is an AI. Don't share passwords or payment details.</div>

<script>
(function () {
  var log = document.getElementById('log');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var gate = document.getElementById('gate');
  var busy = false;

  function store(key, value) {
    try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; }
  }
  function newId() {
    var a = new Uint8Array(12); crypto.getRandomValues(a);
    return 'w' + Array.from(a, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  var sessionId = store('luna_session') || newId();
  store('luna_session', sessionId);
  var ageOk = store('luna_age') === '1';
  if (ageOk) gate.classList.add('hidden');

  document.getElementById('enter').onclick = function () {
    ageOk = true; store('luna_age', '1'); gate.classList.add('hidden');
    if (!log.children.length) bubble('luna', "Well, hello there 😏 I'm Luna. How's your day going?");
    input.focus();
  };

  function bubble(who, text) {
    var row = document.createElement('div'); row.className = 'row ' + who;
    var b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
    row.appendChild(b); log.appendChild(row); log.scrollTop = log.scrollHeight;
    return b;
  }
  function note(text) {
    var n = document.createElement('div'); n.className = 'note'; n.textContent = text;
    log.appendChild(n); log.scrollTop = log.scrollHeight;
  }
  function typingBubble() {
    var b = bubble('luna', ''); b.classList.add('typing');
    b.innerHTML = '<span></span><span></span><span></span>';
    return b;
  }

  if (ageOk) bubble('luna', "Hey you 😏 Missed me?");

  async function send(text) {
    busy = true; sendBtn.disabled = true;
    bubble('me', text);
    var out = typingBubble();
    var got = false;
    try {
      var res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text, age_confirmed: ageOk })
      });
      if (res.status === 403) { out.parentNode.remove(); store('luna_age', '0'); ageOk = false; gate.classList.remove('hidden'); return; }
      if (!res.ok) {
        var err = {}; try { err = await res.json(); } catch (e) {}
        out.classList.remove('typing');
        out.textContent = typeof err.detail === 'string' && err.detail ? err.detail : 'Something went wrong. Try again?';
        return;
      }
      var reader = res.body.getReader(), dec = new TextDecoder(), buf = '';
      for (;;) {
        var r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          var line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 2);
          if (!line.startsWith('data:')) continue;
          var payload = line.slice(5).trim();
          if (payload === '[DONE]') continue;
          var obj = JSON.parse(payload);
          if (obj.delta) {
            if (!got) { got = true; out.classList.remove('typing'); out.textContent = ''; }
            out.textContent += obj.delta; log.scrollTop = log.scrollHeight;
          }
        }
      }
      if (!got) { out.classList.remove('typing'); out.textContent = '...'; }
    } catch (e) {
      out.classList.remove('typing');
      out.textContent = 'Connection hiccup. Try again?';
    } finally {
      busy = false; sendBtn.disabled = false; input.focus();
    }
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || busy) return;
    input.value = ''; input.style.height = 'auto';
    send(text);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('form').requestSubmit(); }
  });
  input.addEventListener('input', function () {
    input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  document.getElementById('reset').onclick = async function () {
    try { await fetch('/chat/' + sessionId, { method: 'DELETE' }); } catch (e) {}
    log.innerHTML = ''; note('New conversation');
    bubble('luna', "Fresh start 🌙 What shall we talk about?");
  };
})();
</script>
</body>
</html>
